services:

  # ── OCR Service (vLLM + GLM-OCR, requires NVIDIA GPU) ─────────────────────
  # Optional — start with: docker compose --profile ocr up
  # Per-page OCR does not need a 41k context window; a lower max_model_len avoids
  # KV-cache OOM on smaller GPUs. Tune via OCR_MAX_MODEL_LEN / OCR_GPU_MEMORY_UTILIZATION.
  ocr:
    profiles: ["ocr"]
    build: ./ocr      # extends vllm/vllm-openai with an up-to-date transformers
    # Override the image's ENTRYPOINT entirely so we control the full command.
    # Without this, the image's built-in entrypoint gets prepended and causes
    # argument-parsing errors (e.g. "unrecognized arguments: zai-org/GLM-OCR").
    entrypoint: []
    command:
      - vllm
      - serve
      - zai-org/GLM-OCR
      - --allowed-local-media-path
      - /ocr_temp
      - --port
      - "8080"
      - --gpu-memory-utilization
      - "${OCR_GPU_MEMORY_UTILIZATION:-0.85}"
      - --max-model-len
      - "${OCR_MAX_MODEL_LEN:-8192}"
      - --limit-mm-per-prompt
      - '{"image":2}'
      - --trust-remote-code
    ports:
      - "8080:8080"
    volumes:
      - ocr_temp:/ocr_temp
      # Cache the downloaded model weights so they survive container restarts
      - huggingface_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 20          # model loading can take several minutes
      start_period: 120s
    restart: unless-stopped

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  backend:
    build: ./backend
    ports:
      - "8000:8000"
      - "6006:6006"        # Arize Phoenix observability UI (optional)
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      # Dockerized backend can reach a host-running vLLM endpoint through
      # host.docker.internal. Set BACKEND_LOCAL_VLLM_BASE_URL=http://llm:9001/v1
      # if you want direct Compose service DNS instead.
      - LOCAL_VLLM_BASE_URL=${BACKEND_LOCAL_VLLM_BASE_URL:-http://host.docker.internal:9001/v1}
      - LOCAL_VLLM_API_KEY=${LOCAL_VLLM_API_KEY:-EMPTY}
      - LOCAL_VLLM_DISABLE_THINKING=${LOCAL_VLLM_DISABLE_THINKING:-true}
      # PDF parser feature flag: auto | local_ocr | zai_ocr | pymupdf
      - PDF_PARSER_MODE=${PDF_PARSER_MODE:-auto}
      # Hosted Z.ai GLM-OCR API key (same model as the local OCR service,
      # no GPU needed). Used by zai_ocr mode and by auto mode when the
      # local OCR container is not running.
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      # Optional GLM-OCR / vLLM vision endpoint (OpenAI-compatible /v1/chat/completions).
      # Leave empty to use Z.ai (if ZAI_API_KEY set) or PyMuPDF. For a remote
      # OpenAI-compatible OCR server, set e.g.:
      # OCR_SERVER_URL=https://your-host/v1/chat/completions
      # With --profile ocr, defaults to the local Compose OCR container.
      - OCR_SERVER_URL=${OCR_SERVER_URL:-}
      # Shared temp dir when using the local OCR profile (page images via file://)
      - TMPDIR=/ocr_temp
    volumes:
      - ./backend/data:/app/data   # persist papers, cache, phoenix DB
      - ocr_temp:/ocr_temp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Backend starts independently — it gracefully falls back to PyMuPDF
    # when OCR is still loading, so no hard dependency is needed.
    restart: unless-stopped

  # ── Frontend (React / Vite → nginx) ───────────────────────────────────────
  frontend:
    build: ./web_ui
    ports:
      - "5173:80"          # keeps the same URL as the local dev server
    depends_on:
      - backend
    restart: unless-stopped

  # ── Optional local LLM (vLLM + Qwen, requires NVIDIA Spark / GB10 GPU) ──────
  # Start explicitly with:
  #   bash scripts/start-local-vllm.sh
  #
  # This mirrors the spark-vllm-docker qwen3.6-35b-a3b-fp8 solo recipe, but keeps
  # it out of the default stack so normal backend/frontend startup stays light.
  llm:
    profiles: ["local-llm"]
    image: ${LOCAL_VLLM_IMAGE:-vllm-node}
    build:
      context: ./spark-vllm-docker
    entrypoint: []
    command:
      - vllm
      - serve
      - ${LOCAL_VLLM_MODEL:-Qwen/Qwen3.6-35B-A3B-FP8}
      - --host
      - 0.0.0.0
      - --port
      - "9001"
      - --served-model-name
      - ${LOCAL_VLLM_SERVED_MODEL_NAME:-local-qwen3.6}
      - --max-model-len
      - ${LOCAL_VLLM_MAX_MODEL_LEN:-32768}
      - --max-num-batched-tokens
      - ${LOCAL_VLLM_MAX_NUM_BATCHED_TOKENS:-16384}
      - --gpu-memory-utilization
      - ${LOCAL_VLLM_GPU_MEMORY_UTILIZATION:-0.7}
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml
      - --kv-cache-dtype
      - fp8
      - --load-format
      - fastsafetensors
      - --attention-backend
      - flashinfer
      - --enable-prefix-caching
      - --chat-template
      - /workspace/fixed_chat_template.jinja
      - -tp
      - ${LOCAL_VLLM_TENSOR_PARALLEL:-1}
    ports:
      - "${LOCAL_VLLM_PORT:-9001}:9001"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HOME=/root/.cache/huggingface
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
    volumes:
      - huggingface_cache:/root/.cache/huggingface
      - vllm_cache:/root/.cache/vllm
      - flashinfer_cache:/root/.cache/flashinfer
      - triton_cache:/root/.triton
      - ./spark-vllm-docker/mods/fix-qwen3.6-chat-template/chat_template.jinja:/workspace/fixed_chat_template.jinja:ro
    ipc: host
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 300s
    restart: unless-stopped

volumes:
  ocr_temp:               # shared temp dir for PDF page images
  huggingface_cache:      # persists model weights across restarts
  vllm_cache:             # persists vLLM compilation/runtime cache
  flashinfer_cache:       # persists FlashInfer cache for Spark-optimized kernels
  triton_cache:           # persists Triton kernel cache
